<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sudoku — offline</title>
<style>
  :root { color-scheme: light; }
  body {
    font-family: ui-monospace, monospace;
    background: #f4f1ea; color: #212121;
    display: flex; gap: 28px; padding: 24px; margin: 0;
    align-items: flex-start;
  }
  h1 { font-size: 18px; margin: 0 0 10px; }
  .panel { display: flex; flex-direction: column; gap: 10px; }
  #board {
    display: grid;
    grid-template-columns: repeat(9, 40px) auto auto;
    width: max-content;
    background: #212121;
    border: 3px solid #212121;
  }
  .cell {
    width: 40px; height: 40px;
    background: #fffdf7; color: #212121;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; cursor: pointer; user-select: none;
    border-right: 1px solid #cfc8ba; border-bottom: 1px solid #cfc8ba;
    box-sizing: border-box;
  }
  .cell.given { font-weight: bold; background: #f0ebdd; }
  .cell.selected { outline: 2px solid #2e7d32; outline-offset: -2px; }
  .cell.wrong { color: #c62828; }
  .cell.notes {
    font-size: 11px; color: #777;
    display: grid; grid-template-columns: repeat(3, 1fr);
    line-height: 1.2; white-space: pre;
  }
  .vgap { width: 3px; }
  .hgap-full { grid-column: 1 / -1; height: 3px; }
  button {
    font: inherit; background: #fffdf7; color: #212121;
    border: 1px solid #b9b2a3; padding: 6px 12px; cursor: pointer;
  }
  button.active { outline: 2px solid #2e7d32; }
  #status { min-height: 20px; font-size: 14px; }
  @media print {
    body { display: block; }
    .noprint { display: none !important; }
    #board { border-width: 2px; }
  }
</style>
</head>
<body>
  <div class="panel">
    <h1>sudoku <small>(offline)</small></h1>
    <div class="noprint" style="display:flex; gap:8px; flex-wrap:wrap;">
      <button id="new-easy">easy</button>
      <button id="new-medium">medium</button>
      <button id="new-hard">hard</button>
      <button id="hint">hint</button>
      <button id="note-mode">✏ notes (n)</button>
      <button id="solve">solve</button>
      <button id="print">🖨 print/PDF</button>
    </div>
    <div class="noprint" style="display:flex; gap:8px;">
      <input id="grid-line" placeholder="paste 81-char grid" size="28">
      <button id="load-line">load</button>
    </div>
    <div id="board"></div>
    <div id="status"></div>
  </div>
  <div class="panel noprint">
    <h2>how to play</h2>
    <ul style="padding-left: 18px; margin: 0; font-size: 13px;">
      <li>click a cell, type 1–9</li>
      <li>n toggles pencil notes</li>
      <li>arrow keys move the selection</li>
      <li>red digits clash with the solution</li>
      <li>hint fills the most constrained cell</li>
      <li>progress autosaves in this browser</li>
    </ul>
  </div>
<script type="module">
/*__GAME__*/
</script>
</body>
</html>
